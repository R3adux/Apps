name: Licht · Windows (Licht.exe)

on:
  push:
    branches: [main]
    paths: ['apps/licht/**', '.github/workflows/licht-windows.yml']
  pull_request:
    paths: ['apps/licht/**', '.github/workflows/licht-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that is still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/licht
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Abhängigkeiten
        run: npm ci

      - name: Fenster-Programm bauen
        run: dotnet build desktop -c Release -nologo

      - name: Tests
        run: node --test test/model.test.js test/pairing.test.js test/http.test.js test/color.test.js test/hub.test.js test/app.test.js test/desktop.test.js

      - name: Licht.exe bauen
        run: node scripts/build-exe.mjs

      - name: Licht.exe starten und prüfen
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path dist\Licht.exe).Path
          # Window program (no black console window)?
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          if ($subsystem -ne 2) { throw "Licht.exe ist kein Fensterprogramm (Subsystem $subsystem)" }

          $env:LICHT_NO_BROWSER = "1"
          $env:PORT = "8090"
          $env:LICHT_DATA = "$env:RUNNER_TEMP\licht-data"
          $log = "$env:LICHT_DATA\licht.log"
          $proc = Start-Process -FilePath $exe -PassThru
          $lights = $null
          for ($i = 0; $i -lt 40 -and -not $lights; $i++) {
            try { $lights = Invoke-RestMethod http://localhost:8090/api/lights } catch { Start-Sleep 1 }
          }
          for ($i = 0; $i -lt 30 -and -not (Select-String -Path $log -Pattern 'Tray-Symbol bereit' -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          Get-Content $log
          if (-not $lights) { throw "Licht.exe antwortet nicht" }
          if (-not (Select-String -Path $log -Pattern 'Tray-Symbol bereit' -Quiet)) { throw "Tray-Symbol fehlt" }
          $html = (Invoke-WebRequest http://localhost:8090/ -UseBasicParsing).Content
          if ($html -notmatch "<title>Licht</title>") { throw "Web-App fehlt in Licht.exe" }
          $info = Invoke-RestMethod http://localhost:8090/api/info
          if ($null -eq $info.desktop) { throw "PC-Funktionen fehlen" }

          $window = Get-CimInstance Win32_Process -Filter "Name='LichtFenster.exe'" | Where-Object { $_.ParentProcessId -eq $proc.Id }
          if (-not $window) { throw "Fenster-Programm läuft nicht" }

          # The Licht window opens and loads the page.
          Invoke-RestMethod -Method Post http://localhost:8090/api/show | Out-Null
          for ($i = 0; $i -lt 40 -and -not (Select-String -Path $log -Pattern 'App-Fenster (geladen|nicht)' -Quiet); $i++) { Start-Sleep 1 }
          Select-String -Path $log -Pattern 'App-Fenster'
          if (-not (Select-String -Path $log -Pattern 'App-Fenster geladen' -Quiet)) { throw "Licht-Fenster öffnet nicht" }

          # Second start while Licht runs: must end by itself (it only brings the window to the front).
          $second = Start-Process -FilePath $exe -PassThru
          if (-not $second.WaitForExit(15000)) { $second.Kill(); throw "Zweiter Start beendet sich nicht" }

          # "Licht beenden" from the app.
          Invoke-RestMethod -Method Post http://localhost:8090/api/quit | Out-Null
          if (-not $proc.WaitForExit(15000)) { $proc.Kill(); throw "Licht.exe lässt sich nicht beenden" }
          Start-Sleep 3
          if (Get-CimInstance Win32_Process -Filter "Name='LichtFenster.exe'") { throw "Fenster-Programm läuft nach dem Beenden weiter" }
          Get-Content $log -Tail 5
          if (Select-String -Path $log -Pattern ' ERROR ' -Quiet) { throw "Fehler im Protokoll (licht.log)" }
          "Licht.exe OK ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: Licht-Windows
          path: apps/licht/dist/Licht.exe

      - name: Download-Seite (Release) aktualisieren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the file in the existing release, so the download link never breaks.
          notes="Licht.exe herunterladen und doppelklicken – das Licht-Fenster öffnet sich, Licht läuft dann im Hintergrund weiter (Symbol unten rechts in der Taskleiste). Beim ersten Start: Windows-SmartScreen → „Weitere Informationen“ → „Trotzdem ausführen“, und in der Firewall „Private Netzwerke“ erlauben. Gebaut aus ${GITHUB_SHA:0:7}."
          if gh release view licht-latest >/dev/null 2>&1; then
            gh release upload licht-latest dist/Licht.exe --clobber
            gh release edit licht-latest --title "Licht für Windows" --notes "$notes"
          else
            gh release create licht-latest dist/Licht.exe --target "$GITHUB_SHA" --title "Licht für Windows" --notes "$notes" \
              || gh release create licht-latest dist/Licht.exe --title "Licht für Windows" --notes "$notes"
          fi
