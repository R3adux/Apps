name: Licht · Windows (Licht.exe)

on:
  push:
    branches: [main]
    paths:
      - 'apps/licht/core/**'
      - 'apps/licht/pc/**'
      - 'apps/licht/scripts/build-exe.mjs'
      - 'apps/licht/test/**'
      - 'apps/licht/package*.json'
      - '.github/workflows/licht-windows.yml'
  pull_request:
    paths: ['apps/licht/**', '.github/workflows/licht-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that is still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/licht
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Abhängigkeiten
        run: npm ci

      - name: Tests Fenster-Logik (C#)
        working-directory: apps/licht/pc/fenster
        run: dotnet test --project Licht.Fenster.Tests

      - name: Tests (Node)
        run: node --test --test-concurrency=1 test/model.test.js test/pairing.test.js test/api.test.js test/color.test.js test/qr.test.js test/fenster-xaml.test.js test/hub.test.js test/pc.test.js test/windows.test.js

      - name: Licht.exe bauen
        run: node scripts/build-exe.mjs

      - name: Fenster zeichnen (Bilder aller Zustände, hell und dunkel)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\fenster-bilder"
          $exe = (Resolve-Path pc\fenster\LichtFenster\bin\Release\net48\LichtFenster.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--render', "`"$out`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\render.txt"
          Get-Content "$env:RUNNER_TEMP\render.txt"
          if ($p.ExitCode -ne 0) { throw "Fenster zeichnen fehlgeschlagen ($($p.ExitCode))" }
          $pictures = Get-ChildItem $out -Filter *.png | Sort-Object Name
          if ($pictures.Count -lt 20) { throw "Nur $($pictures.Count) Bilder" }
          # The pictures go into this log (Base64 between markers), to look at them without artifacts:
          # download the log and decode the lines between BILD-ANFANG and BILD-ENDE.
          foreach ($picture in $pictures) {
            "BILD-ANFANG $($picture.Name)"
            $text = [Convert]::ToBase64String([IO.File]::ReadAllBytes($picture.FullName))
            for ($i = 0; $i -lt $text.Length; $i += 2000) { $text.Substring($i, [Math]::Min(2000, $text.Length - $i)) }
            "BILD-ENDE"
          }

      - name: Licht.exe starten und bedienen
        shell: pwsh
        timeout-minutes: 6
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $A = [Windows.Automation.AutomationElement]
          $Scope = [Windows.Automation.TreeScope]
          function Find($root, $name, $scope = $Scope::Descendants) {
            $root.FindFirst($scope, (New-Object Windows.Automation.PropertyCondition($A::NameProperty, $name)))
          }
          function FindEdit($root, $name) {
            $c = New-Object Windows.Automation.AndCondition(
              (New-Object Windows.Automation.PropertyCondition($A::NameProperty, $name)),
              (New-Object Windows.Automation.PropertyCondition($A::ControlTypeProperty, [Windows.Automation.ControlType]::Edit)))
            $root.FindFirst($Scope::Descendants, $c)
          }
          function FindId($root, $id) {
            $root.FindFirst($Scope::Descendants, (New-Object Windows.Automation.PropertyCondition($A::AutomationIdProperty, $id)))
          }
          function Wait($what, $test, $seconds = 30) {
            for ($i = 0; $i -lt $seconds * 4; $i++) { $r = & $test; if ($r) { return $r }; Start-Sleep -Milliseconds 250 }
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Zeitüberschreitung: $what"
          }
          function Press($button) { $button.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke() }
          function LichtWindow() {
            $w = Find $A::RootElement 'Licht' $Scope::Children
            if ($w -and $w.Current.ProcessId -eq $window.Id) { return $w }
            return $null
          }

          $exe = (Resolve-Path dist\Licht.exe).Path
          # A window program (no black console window)?
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          if ($subsystem -ne 2) { throw "Licht.exe ist kein Fensterprogramm (Subsystem $subsystem)" }

          $env:LICHT_DATA = "$env:RUNNER_TEMP\licht-data"
          $log = "$env:LICHT_DATA\licht.log"
          $browsers = 'msedge', 'chrome', 'firefox', 'iexplore', 'msedgewebview2'
          $before = @(Get-Process -Name $browsers -ErrorAction SilentlyContinue | ForEach-Object Id)
          $started = Get-Date
          $proc = Start-Process -FilePath $exe -PassThru

          function InLog($pattern) { (Test-Path $log) -and (Select-String -Path $log -Pattern $pattern -Quiet) }
          Wait 'Fenster bereit' { InLog 'Fenster: Fenster bereit' } | Out-Null
          "Fenster bereit nach $([math]::Round(((Get-Date) - $started).TotalSeconds, 1)) s"
          Wait 'Licht läuft' { InLog 'Licht läuft \(' } 60 | Out-Null
          "Lampen-Teil bereit nach $([math]::Round(((Get-Date) - $started).TotalSeconds, 1)) s"

          $window = Get-CimInstance Win32_Process -Filter "Name='LichtFenster.exe'" | Where-Object { $_.ParentProcessId -eq $proc.Id }
          if (-not $window) { throw "Fenster-Programm läuft nicht" }
          $window = Get-Process -Id $window.ProcessId

          # The Licht window: no lamps yet, add one with a wrong code → error from Licht in the dialog.
          $w = Wait 'Licht-Fenster' { LichtWindow }
          Wait 'Leere Liste' { Find $w 'Noch keine Lampen' } | Out-Null
          Press (Wait 'Knopf Lampe hinzufügen' { Find $w 'Lampe hinzufügen' })
          $code = Wait 'Code-Feld' { FindEdit $w 'Code' }
          $code.GetCurrentPattern([Windows.Automation.ValuePattern]::Pattern).SetValue('123')
          Press (Find $w 'Hinzufügen')
          $err = Wait 'Fehlermeldung' { $e = FindId $w 'Fehler'; if ($e -and $e.Current.Name) { $e } }
          "Fehlermeldung im Fenster: $($err.Current.Name)"
          Press (Find $w 'Abbrechen')
          Wait 'Dialog zu' { -not (FindEdit $w 'Code') } 10 | Out-Null

          # Closing the window keeps Licht running in the background.
          $w.GetCurrentPattern([Windows.Automation.WindowPattern]::Pattern).Close()
          Wait 'Fenster versteckt' { -not (LichtWindow) } 10 | Out-Null
          if ($proc.HasExited -or $window.HasExited) { throw "Licht hat sich beim Schließen des Fensters beendet" }

          # Starting Licht.exe again brings the window back and ends by itself.
          $second = Start-Process -FilePath $exe -PassThru
          if (-not $second.WaitForExit(15000)) { $second.Kill(); throw "Zweiter Start beendet sich nicht" }
          Wait 'Fenster wieder da' { LichtWindow } 15 | Out-Null

          # No browser, no web server.
          $new = @(Get-Process -Name $browsers -ErrorAction SilentlyContinue | Where-Object { $before -notcontains $_.Id })
          if ($new.Count) { throw "Browser gestartet: $($new.Name -join ', ')" }
          $listening = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in @($proc.Id, $window.Id) })
          if ($listening.Count) { throw "Licht wartet auf TCP-Verbindungen: $($listening.LocalPort -join ', ')" }

          # "Licht.exe --quit" ends the running Licht, window and tray symbol included.
          $quit = Start-Process -FilePath $exe -ArgumentList '--quit' -PassThru
          if (-not $quit.WaitForExit(15000)) { throw "--quit beendet sich nicht" }
          if (-not $proc.WaitForExit(20000)) { $proc.Kill(); throw "Licht.exe lässt sich nicht beenden" }
          if (-not $window.WaitForExit(5000)) { throw "Fenster-Programm läuft nach dem Beenden weiter" }

          Get-Content $log
          if (Select-String -Path $log -Pattern ' ERROR |Fehler im Fenster|abgestürzt' -Quiet) { throw "Fehler im Protokoll (licht.log)" }
          "Licht.exe OK ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Download-Seite (Release) aktualisieren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the file in the existing release, so the download link never breaks.
          notes="Licht.exe herunterladen und doppelklicken – das Licht-Fenster öffnet sich, Licht läuft dann im Hintergrund weiter (Lampen-Symbol unten rechts in der Taskleiste). Kein Browser, nichts zu installieren. Beim ersten Start: Windows-SmartScreen → „Weitere Informationen“ → „Trotzdem ausführen“, und in der Firewall „Private Netzwerke“ erlauben. Gebaut aus ${GITHUB_SHA:0:7}."
          if gh release view licht-latest >/dev/null 2>&1; then
            gh release upload licht-latest dist/Licht.exe --clobber
            gh release edit licht-latest --title "Licht für Windows" --notes "$notes"
          else
            gh release create licht-latest dist/Licht.exe --target "$GITHUB_SHA" --title "Licht für Windows" --notes "$notes" \
              || gh release create licht-latest dist/Licht.exe --title "Licht für Windows" --notes "$notes"
          fi
