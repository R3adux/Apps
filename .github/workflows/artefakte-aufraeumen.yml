name: Aufräumen · alte Build-Artefakte löschen

# Einmalig von Hand gestartet: löscht alle gespeicherten Build-Artefakte des Repos. Die Builds legen keine
# mehr ab – die fertigen Programme liegen auf den Download-Seiten (Releases).
on: workflow_dispatch

permissions:
  actions: write

jobs:
  artefakte:
    runs-on: ubuntu-latest
    steps:
      - name: Alle Artefakte löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id) \(.size_in_bytes) \(.name)"' > artefakte.txt
          echo "Gefunden: $(wc -l < artefakte.txt) Artefakte, $(awk '{s+=$2} END {printf "%.0f", s/1048576}' artefakte.txt) MB"
          deleted=0
          while read -r id size name; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent; then deleted=$((deleted + 1)); fi
          done < artefakte.txt
          echo "Gelöscht: $deleted"
          echo "Übrig: $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=1" --jq '.total_count')"
